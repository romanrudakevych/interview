<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>interview</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages — MIT licensed
      // GitHub Pages serves this file for unknown paths; it encodes the
      // requested URL into a query string and redirects to the app root,
      // where the snippet in index.html decodes it back before React mounts.
      var pathSegmentsToKeep = 1; // keep the "/interview" project-site segment

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
